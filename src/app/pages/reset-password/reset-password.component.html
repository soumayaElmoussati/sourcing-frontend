<div class="forgot-password-wrapper">
    <div class="w-6/12 h-screen hidden md:block flex-shrink-0 forgot-password-left">
        <div class="overlay">
            <div class="overlay-content">
                <h1><img src="/images/logoSourcing.png" alt="Logo" class="brand-logo"></h1>
                <div class="brand-subtitle">
                    <div class="divider-line"></div>
                    <p>Votre plateforme de gestion des talents</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="w-full forgot-password-right">
        <div class="auth-container">
            <div class="auth-content">
                <!-- Header élégant -->
                <div class="auth-header">
                    <div class="logo-wrapper">
                        <img src="/images/logoSourcing.png" alt="Logo" class="mobile-logo">
                    </div>
                    <div class="header-text">
                        <h1 class="title">Réinitialisation du mot de passe</h1>
                        <p class="subtitle">Entrez votre adresse email pour recevoir les instructions</p>
                    </div>
                </div>

                <!-- Formulaire épuré -->
                <form class="auth-form">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <label for="email" class="input-label">
                                <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20">
                                    <path fill="currentColor" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                                </svg>
                                <span>Adresse email</span>
                            </label>
                            <input 
                                id="email" 
                                type="email" 
                                placeholder="exemple@entreprise.com" 
                                class="modern-input"
                                required
                            >
                            <div class="input-underline"></div>
                        </div>
                        <p class="input-hint">Un lien de réinitialisation vous sera envoyé par email</p>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span class="btn-text">Envoyer le lien</span>
                        <i class="btn-icon">→</i>
                    </button>
                </form>

                <!-- Lien retour -->
                <div class="auth-footer">
                    <a href="/login" class="back-link">
                        <i class="icon-arrow-left"></i>
                        <span>Retour à la connexion</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
