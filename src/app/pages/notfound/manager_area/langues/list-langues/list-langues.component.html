<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="text-center mb-5" style="padding-bottom: 1rem;">
        <div class="text-900 text-3xl font-medium mb-3">Gestion des Langues</div>
        <span class="text-600 font-medium">Gérez vos langues disponibles.</span>
      </div>

      <p-toast></p-toast>
      <p-confirmDialog [style]="{ width: '460px' }"></p-confirmDialog>

      <div class="card">
        <p-toolbar class="mb-2">
          <ng-template pTemplate="left">
            <div class="flex gap-2 items-center flex-wrap">
              <button pButton pRipple label="Nouveau" icon="pi pi-plus" class="p-button-success" (click)="openNew()"></button>
              <button pButton pRipple label="Supprimer" icon="pi pi-trash" class="p-button-danger"
                (click)="deleteSelectedLangues()"
                [disabled]="!selectedLangues || !selectedLangues.length">
              </button>
            </div>
          </ng-template>

          <ng-template pTemplate="right">
            <span class="p-input-icon-left w-full md:w-auto">
              <input
                pInputText
                type="text"
                [(ngModel)]="globalFilterValue"
                (keydown.enter)="onGlobalFilter(dt, $event)"
                placeholder="Rechercher..."
              />
            </span>
          </ng-template>
        </p-toolbar>

        <div class="flex flex-column md:flex-row md:justify-content-between">
          <p-table
            #dt
            [value]="langues"
            responsiveLayout="scroll"
            [scrollable]="true"
            scrollWidth="200px"
            [rows]="10"
            [paginator]="true"
            [globalFilterFields]="['titre', 'codeLg', 'flag']"
            [(selection)]="selectedLangues"
            [rowHover]="true"
            dataKey="id"
            [loading]="loading"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} langues"
            [rowsPerPageOptions]="[10, 25, 50]"
          >
            <ng-template pTemplate="header">
              <tr>
                <th style="width: 5rem">
                  <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
                </th>
                <th pSortableColumn="titre" style="min-width:10rem">Titre <p-sortIcon field="titre"></p-sortIcon></th>
                <th pSortableColumn="codeLg" style="min-width:6rem">Code <p-sortIcon field="codeLg"></p-sortIcon></th>
                <th pSortableColumn="flag" style="min-width:6rem">Drapeau <p-sortIcon field="flag"></p-sortIcon></th>
                <th style="width: 9rem"></th>
              </tr>
            </ng-template>

            <ng-template pTemplate="body" let-langue>
              <tr>
                <td>
                  <p-tableCheckbox [value]="langue"></p-tableCheckbox>
                </td>
                <td>{{ langue.titre }}</td>
                <td>{{ langue.codeLg }}</td>
                <td class="flex justify-content-center">
                  <img [src]="langue.flag" alt="{{ langue.titre }} drapeau" style="width: 45px; height: 35px;" />
                </td>
                <td>
                  <div class="flex">
                    <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editLangue(langue)"></button>
                    <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger" (click)="deleteLangue(langue)"></button>
                  </div>
                </td>
              </tr>
            </ng-template>

            <ng-template pTemplate="summary">
              <div class="flex align-items-center justify-content-between">
                Au total il y a {{ langues ? langues.length : 0 }} langues.
              </div>
            </ng-template>
          </p-table>
        </div>
      </div>

      <p-dialog [(visible)]="deleteLangueDialog" header="Confirmation" [modal]="true" [style]="{ width: '450px' }">
        <div class="flex align-items-center justify-content-center">
          <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem; padding-right: 0.5rem;"></i>
          <span *ngIf="langue">Êtes-vous sûr de vouloir supprimer <b>{{ langue.titre }}</b> ?</span>
        </div>
        <ng-template pTemplate="footer">
          <button pButton pRipple icon="pi pi-times" class="p-button-text" label="Non" (click)="deleteLangueDialog = false"></button>
          <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Oui" (click)="confirmDelete()"></button>
        </ng-template>
      </p-dialog>

      <p-dialog [(visible)]="deleteLanguesDialog" header="Confirmation" [modal]="true" [style]="{ width: '460px' }">
        <div class="flex align-items-center justify-content-center">
          <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem; padding-right: 0.5rem;"></i>
          <span>Êtes-vous sûr de vouloir supprimer les langues sélectionnées ?</span>
        </div>
        <ng-template pTemplate="footer">
          <button pButton pRipple icon="pi pi-times" class="p-button-text" label="Non" (click)="deleteLanguesDialog = false"></button>
          <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Oui" (click)="confirmDeleteSelected()"></button>
        </ng-template>
      </p-dialog>
    </div>
  </div>
</div>
